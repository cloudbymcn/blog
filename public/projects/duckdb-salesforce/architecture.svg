<path d="M360,238 L360,192" fill="none" stroke="#52525b" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<path d="M445,270 L480,270" fill="none" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/>
