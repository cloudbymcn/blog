<g><rect x="35" y="238" width="150" height="64" rx="12" fill="#18181b" stroke="#f4f4f5" stroke-width="1.5"/><text x="110" y="266" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">Analista</text><text x="110" y="285" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">ATTACH · SELECT</text></g>
<g><rect x="275" y="128" width="170" height="64" rx="12" fill="#0b1a22" stroke="#38bdf8" stroke-width="1.5"/><text x="360" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">Catálogo</text><text x="360" y="175" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">sObject → tabela</text></g>
<g><rect x="275" y="238" width="170" height="64" rx="12" fill="#0b1a22" stroke="#38bdf8" stroke-width="1.5"/><text x="360" y="266" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">Query builder</text><text x="360" y="285" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">SOQL + pushdown</text></g>
<g><rect x="275" y="368" width="170" height="64" rx="12" fill="#0b1a22" stroke="#38bdf8" stroke-width="1.5"/><text x="360" y="396" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">Auth</text><text x="360" y="415" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">OAuth · JWT · env</text></g>
