<g><rect x="745" y="158" width="170" height="64" rx="12" fill="#151518" stroke="#a1a1aa" stroke-width="1.5"/><text x="830" y="186" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">REST /query</text><text x="830" y="205" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">paginação lazy</text></g>
<g><rect x="745" y="298" width="170" height="64" rx="12" fill="#151518" stroke="#a1a1aa" stroke-width="1.5"/><text x="830" y="326" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">Bulk API 2.0</text><text x="830" y="345" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">CSV · PK chunking</text></g>
<g><rect x="35" y="398" width="150" height="64" rx="12" fill="#0a1a14" stroke="#34d399" stroke-width="1.5"/><text x="110" y="426" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">Parquet · CSV</text><text x="110" y="445" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">joins locais</text></g>
<text x="40" y="516" font-size="11" fill="#71717a" font-family="JetBrains Mono, ui-monospace, monospace">Só leitura. CI em Linux, Windows e macOS arm64. Código aberto (MIT).</text>
<text x="920" y="516" text-anchor="end" font-size="11" fill="#52525b" font-family="JetBrains Mono, ui-monospace, monospace">cloudbymcn.com</text>
