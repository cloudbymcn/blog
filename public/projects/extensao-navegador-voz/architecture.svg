<g><rect x="20" y="238" width="180" height="64" rx="12" fill="#18181b" stroke="#f4f4f5" stroke-width="1.5"/><text x="110" y="266" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">Voz</text><text x="110" y="285" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">reconhecimento do Chrome</text></g>
<g><rect x="265" y="168" width="170" height="64" rx="12" fill="#0b1a22" stroke="#38bdf8" stroke-width="1.5"/><text x="350" y="196" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">Parser local</text><text x="350" y="215" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">&lt; 1 ms · PT-BR</text></g>
<g><rect x="265" y="348" width="170" height="64" rx="12" fill="#170d22" stroke="#c084fc" stroke-width="1.5"/><text x="350" y="376" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">LLM de decisão</text><text x="350" y="395" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">opções fechadas</text></g>
<g><rect x="525" y="238" width="150" height="64" rx="12" fill="#0b1a22" stroke="#38bdf8" stroke-width="1.5"/><text x="600" y="266" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">Ação</text><text x="600" y="285" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">validada</text></g>
