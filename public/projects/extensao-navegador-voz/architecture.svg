<path d="M350,232 L350,348" fill="none" stroke="#52525b" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="307.6" y="270" width="84.8" height="17" rx="4" fill="#0e0e10"/><text x="350" y="282" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">não entendi</text>
<path d="M435,223.8 L525,249" fill="none" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M422.72727272727275,348 L527.2727272727273,302" fill="none" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/>
