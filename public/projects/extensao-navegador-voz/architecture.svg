<g><rect x="750" y="348" width="180" height="64" rx="12" fill="#151518" stroke="#a1a1aa" stroke-width="1.5"/><text x="840" y="376" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">Windows</text><text x="840" y="395" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">native host (opcional)</text></g>
<text x="40" y="516" font-size="11" fill="#71717a" font-family="JetBrains Mono, ui-monospace, monospace">Nada de áudio gravado. Ao LLM vão só a frase, o site e rótulos curtos dos botões visíveis.</text>
<text x="920" y="516" text-anchor="end" font-size="11" fill="#52525b" font-family="JetBrains Mono, ui-monospace, monospace">cloudbymcn.com</text>
