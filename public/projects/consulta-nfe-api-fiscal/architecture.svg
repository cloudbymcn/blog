<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Consulta de NF-e sem abrir o site">
<title>Consulta de NF-e sem abrir o site</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker>
<radialGradient id="glow" cx="80%" cy="0%" r="70%"><stop offset="0" stop-color="#38bdf8" stop-opacity=".10"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient></defs>
<rect width="960" height="540" fill="#0e0e10"/><rect width="960" height="540" fill="url(#glow)"/>
<text x="40" y="52" font-size="22" font-weight="700" fill="#f4f4f5" font-family="Space Grotesk, Inter, sans-serif">Consulta de NF-e sem abrir o site</text>
<text x="40" y="76" font-size="13" fill="#a1a1aa">Um proxy esconde as chaves, parseia o XML e guarda tudo num SQLite local para busca rápida.</text>
