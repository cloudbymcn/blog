<path d="M680,270 L760,270" fill="none" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="691.2" y="250" width="57.6" height="17" rx="4" fill="#0e0e10"/><text x="720" y="262" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">headers</text>
<path d="M786.6666666666666,388 L643.3333333333334,302" fill="none" stroke="#52525b" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<path d="M590,302 L590,388" fill="none" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="571.4" y="325" width="37.2" height="17" rx="4" fill="#0e0e10"/><text x="590" y="337" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">sync</text>
<g><rect x="45" y="238" width="150" height="64" rx="12" fill="#18181b" stroke="#f4f4f5" stroke-width="1.5"/><text x="120" y="266" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">Fiscal</text><text x="120" y="285" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">navegador</text></g>
<g><rect x="255" y="238" width="170" height="64" rx="12" fill="#0b1a22" stroke="#38bdf8" stroke-width="1.5"/><text x="340" y="266" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">React</text><text x="340" y="285" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">Cloudscape · tabela</text></g>
<g><rect x="500" y="238" width="180" height="64" rx="12" fill="#0b1a22" stroke="#38bdf8" stroke-width="1.5"/><text x="590" y="266" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">Express</text><text x="590" y="285" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">proxy · parser XML</text></g>
<g><rect x="760" y="238" width="160" height="64" rx="12" fill="#151518" stroke="#a1a1aa" stroke-width="1.5"/><text x="840" y="266" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">API fiscal</text><text x="840" y="285" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">NF-e · cursor 50</text></g>
<g><rect x="750" y="388" width="180" height="64" rx="12" fill="#0a1a14" stroke="#34d399" stroke-width="1.5"/><text x="840" y="416" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">.env</text><text x="840" y="435" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">id + chave da conta</text></g>
<g><rect x="500" y="388" width="180" height="64" rx="12" fill="#0a1a14" stroke="#34d399" stroke-width="1.5"/><text x="590" y="416" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">SQLite</text><text x="590" y="435" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">node:sqlite · upsert</text></g>
<text x="40" y="516" font-size="11" fill="#71717a" font-family="JetBrains Mono, ui-monospace, monospace">Sync percorre a API uma vez; busca e filtros leem do banco local. Chave nunca vai ao navegador.</text>
<text x="920" y="516" text-anchor="end" font-size="11" fill="#52525b" font-family="JetBrains Mono, ui-monospace, monospace">cloudbymcn.com</text>
