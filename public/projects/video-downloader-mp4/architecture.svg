<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Downloader de vídeo com merge MP4">
<title>Downloader de vídeo com merge MP4</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker>
<radialGradient id="glow" cx="80%" cy="0%" r="70%"><stop offset="0" stop-color="#38bdf8" stop-opacity=".10"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient></defs>
<rect width="960" height="540" fill="#0e0e10"/><rect width="960" height="540" fill="url(#glow)"/>
<text x="40" y="52" font-size="22" font-weight="700" fill="#f4f4f5" font-family="Space Grotesk, Inter, sans-serif">Downloader de vídeo com merge MP4</text>
<text x="40" y="76" font-size="13" fill="#a1a1aa">Cola o link, escolhe a melhor qualidade e junta vídeo + áudio num MP4.</text>
<path d="M205,270 L280,270" fill="none" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="223.9" y="250" width="37.2" height="17" rx="4" fill="#0e0e10"/><text x="242.5" y="262" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">link</text>
<path d="M440,240 L514.6666666666666,212" fill="none" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M690,180 L755,180" fill="none" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M600,212 L600,338" fill="none" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M680,370 L760,370" fill="none" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M360,398 L360,302" fill="none" stroke="#52525b" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<g><rect x="15" y="238" width="190" height="64" rx="12" fill="#18181b" stroke="#f4f4f5" stroke-width="1.5"/><text x="110" y="266" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">Navegador</text><text x="110" y="285" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">HTML/JS · polling 1,5 s</text></g>
<g><rect x="280" y="238" width="160" height="64" rx="12" fill="#0b1a22" stroke="#38bdf8" stroke-width="1.5"/><text x="360" y="266" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">FastAPI</text><text x="360" y="285" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">HTTP Basic</text></g>
<g><rect x="510" y="148" width="180" height="64" rx="12" fill="#0b1a22" stroke="#38bdf8" stroke-width="1.5"/><text x="600" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">yt-dlp</text><text x="600" y="195" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">bestvideo+bestaudio</text></g>
<g><rect x="520" y="338" width="160" height="64" rx="12" fill="#0b1a22" stroke="#38bdf8" stroke-width="1.5"/><text x="600" y="366" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">ffmpeg</text><text x="600" y="385" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">merge → MP4</text></g>
<g><rect x="755" y="148" width="170" height="64" rx="12" fill="#151518" stroke="#a1a1aa" stroke-width="1.5"/><text x="840" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">Sites de vídeo</text><text x="840" y="195" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">+1000 extratores</text></g>
<g><rect x="760" y="338" width="160" height="64" rx="12" fill="#0a1a14" stroke="#34d399" stroke-width="1.5"/><text x="840" y="366" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">downloads/</text><text x="840" y="385" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">Salvar arquivo</text></g>
<g><rect x="265" y="398" width="190" height="64" rx="12" fill="#151518" stroke="#a1a1aa" stroke-width="1.5"/><text x="360" y="426" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">Túnel ou container</text><text x="360" y="445" text-anchor="middle" font-size="11" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace">PC em casa · Render</text></g>
<text x="40" y="516" font-size="11" fill="#71717a" font-family="JetBrains Mono, ui-monospace, monospace">GitHub Pages não serve: precisa de servidor com Python, yt-dlp e ffmpeg.</text>
<text x="920" y="516" text-anchor="end" font-size="11" fill="#52525b" font-family="JetBrains Mono, ui-monospace, monospace">cloudbymcn.com</text>
